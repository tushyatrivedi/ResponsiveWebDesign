<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">FreeCodeCamp's Survey Form</h1>
    <p id="description">
      This is a comprehensive example of html form and its controls
    </p>
    <form action="" id="survey-form">
      <div class="item">
        <label id="name-label" for="name">Name:</label>
        <input type="text" id="name" required placeholder="Your name:" />
      </div>
      <div class="item">
        <label id="email-label" for="email">Email:</label>
        <input type="email" id="email" required placeholder="Your email:" />
      </div>
      <div class="item">
        <label id="number-label" for="number">Age:</label>
        <input
          type="number"
          id="number"
          min="0"
          max="100"
          placeholder="Your age(between 0 and 100):"
        />
      </div>
      <div class="item">
        <label for="dropdown"
          >Which option best describes your current role?</label
        >
        <select name="role-selector" id="dropdown">
          <option value="Backend">Backend Engineer</option>
          <option value="frontend">Frontend Engineer</option>
          <option value="Ux">UX Designer</option>
        </select>
      </div>
      <div class="item">
        <span>Which is your favorite language?</span>
        <label for="html">HTML</label>
        <input id="html" type="radio" name="langauge" value="HTML" />
        <label for="css">CSS</label>
        <input id="css" type="radio" name="langauge" value="CSS" />
        <label for="js">JAVASCRIPT</label>
        <input id="js" type="radio" name="langauge" value="JAVASCRIPT" />
      </div>
      <div class="item">
        <p>What would you like to see improved?</p>
        <label for="challenges">Challenges</label>
        <input
          type="checkbox"
          name="improvement"
          id="challenges"
          value="challenges"
        />
        <label for="projects">Projects</label>
        <input
          type="checkbox"
          name="improvement"
          id="projects"
          value="projects"
        />
        <label for="videos">Videos</label>
        <input type="checkbox" name="improvement" id="videos" value="videos" />
        <label for="data-visualization">Data Visualization</label>
        <input
          type="checkbox"
          name="improvement"
          id="data-visualization"
          value="data-visualization"
        />
      </div>
      <div class="item">
        <label for="feedback">Feedback or suggestions:</label>
        <textarea name="feedback" id="feedback" cols="30"></textarea>
      </div>
      <div class="item">
        <button type="submit" id="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
